[package]
name = "moe-counter-rs"
version = "0.2.1"
edition = "2021"

[dependencies]
axum = "0.7.9"
base64 = "0.22.1"
clap = { version = "4.5.23", features = ["derive"] }
confy = "0.6.1"
image = "0.25.5"
resvg = "0.44.0"
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-embed = "8.5.0"
serde = { version = "1.0.217", features = ["derive"] }
tokio = { version = "1.42.0", features = ["full"] }
toml = "0.8.19"
tracing-subscriber = "0.3.19"
